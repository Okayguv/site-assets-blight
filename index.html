<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Troman - Home</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100vh;
  font-family:'Segoe UI',system-ui,sans-serif;
  background:#000;
  color:#fff;
  overflow-x:hidden;
}

.fullscreen-bg{
  position:fixed;
  inset:0;
  overflow:hidden;
  z-index:1;
  background:#000;
}

.desktop-video{
  position:absolute;
  top:50%;
  left:50%;
  width:100vw;
  height:calc(100vw * (1000 / 2560));
  min-height:100vh;
  min-width:calc(100vh * (2560 / 1000));
  transform:translate(-50%,-50%);
  object-fit:cover;
}

.mobile-video{
  display:none;
}

.page-transition-curtain{
  position:fixed;
  inset:0;
  background:#0d0d0d;
  z-index:9999;
  pointer-events:none;
  opacity:1;
  transition:opacity .4s ease-out;
}

.page-transition-curtain::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.3) 50%),
    linear-gradient(90deg,
    rgba(255,0,0,.05),
    rgba(0,255,0,.02),
    rgba(0,0,255,.05));
  background-size:100% 3px,6px 100%;
}

body.loaded .page-transition-curtain{
  opacity:0;
}

body.exiting .page-transition-curtain{
  opacity:1;
  transition:opacity .25s ease-in;
}

.top-navbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:70px;
  padding:0 40px;
  display:flex;
  align-items:center;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.7),
    rgba(0,0,0,0)
  );
  z-index:20;
  opacity:0;
}

body.loaded .top-navbar{
  opacity:1;
  transition:opacity .8s ease;
}

.hamburger{
  display:none;
  background:none;
  border:none;
  color:#fff;
  font-size:2rem;
  cursor:pointer;
}

.dropdown{
  position:relative;
}

.dropdown-trigger{
  color:#fff;
  text-decoration:none;
  font-size:1.1rem;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:1.5px;
  padding:10px 15px;
  display:flex;
  align-items:center;
  gap:8px;
  text-shadow:1px 1px 4px rgba(0,0,0,.8);
}

.dropdown-trigger::after{
  content:"▼";
  font-size:.7rem;
  transition:transform .3s ease;
}

.dropdown-menu{
  position:absolute;
  top:100%;
  left:0;
  min-width:220px;
  list-style:none;
  background:rgba(15,15,15,.95);
  border:1px solid rgba(255,255,255,.15);
  border-radius:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
  opacity:0;
  visibility:hidden;
  transform:translateY(10px);
  transition:.25s ease;
}

.dropdown:hover .dropdown-menu{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

.dropdown:hover .dropdown-trigger::after{
  transform:rotate(180deg);
}

.dropdown-menu a,
.sub-menu a{
  display:block;
  color:rgba(255,255,255,.75);
  text-decoration:none;
  padding:12px 20px;
  transition:.2s;
}

.dropdown-menu a:hover,
.sub-menu a:hover{
  background:rgba(255,255,255,.08);
  color:#fff;
}

.nested-dropdown{
  position:relative;
}

.nested-dropdown > a::after{
  content:" ▶";
  float:right;
}

.sub-menu{
  position:absolute;
  left:100%;
  top:0;
  min-width:180px;
  list-style:none;
  background:rgba(20,20,20,.98);
  border:1px solid rgba(255,255,255,.15);
  border-radius:6px;
  opacity:0;
  visibility:hidden;
  transform:translateX(10px);
  transition:.25s ease;
}

.nested-dropdown:hover .sub-menu{
  opacity:1;
  visibility:visible;
  transform:translateX(0);
}

.content-overlay{
  position:relative;
  z-index:2;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:90px 20px 40px;
}

@keyframes glitchIntro{
  0%{
    opacity:0;
    transform:translateY(15px) skewX(4deg);
    filter:blur(2px);
  }
  60%{
    opacity:.8;
    transform:translateY(-2px) skewX(-2deg);
    filter:blur(0);
  }
  80%{
    transform:skewX(8deg);
  }
  100%{
    opacity:1;
    transform:none;
  }
}

.company-logo{
  max-width:450px;
  height:auto;
  display:block;
  margin-bottom:25px;
  filter:drop-shadow(0 4px 15px rgba(0,0,0,.5));
  opacity:0;
}

body.loaded .company-logo{
  animation:glitchIntro .5s forwards;
  animation-delay:.15s;
}

.blurb{
  max-width:600px;
  font-size:1.4rem;
  line-height:1.6;
  letter-spacing:.5px;
  opacity:0;
  text-shadow:1px 1px 5px rgba(0,0,0,.8);
}

body.loaded .blurb{
  animation:glitchIntro .6s forwards;
  animation-delay:.3s;
}

@media (max-width:768px){

  .desktop-video{
    display:none;
  }

  .mobile-video{
    display:block;
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .top-navbar{
    height:60px;
    padding:0 20px;
  }

  .hamburger{
    display:block;
  }

  .dropdown{
    display:none;
    position:absolute;
    top:60px;
    left:20px;
  }

  .dropdown.active{
    display:block;
  }

  .dropdown-menu{
    position:relative;
    display:block;
    opacity:1;
    visibility:visible;
    transform:none;
  }

  .sub-menu{
    display:none;
    position:relative;
    left:0;
    top:0;
    width:100%;
    opacity:1;
    visibility:visible;
    transform:none;
    background:rgba(0,0,0,.2);
    border:none;
  }

  .nested-dropdown.open .sub-menu{
    display:block;
  }

  .nested-dropdown > a::after{
    content:" ▼";
  }

  .company-logo{
    max-width:280px;
  }

  .blurb{
    font-size:1.1rem;
  }
}
</style>
</head>

<body>

<div class="page-transition-curtain"></div>

<nav class="top-navbar">

  <button class="hamburger" aria-label="Open Menu">
    ☰
  </button>

  <div class="dropdown">

    <a href="index.html" class="dropdown-trigger transition-link">
      Home
    </a>

    <ul class="dropdown-menu">

      <li class="nested-dropdown">
        <a href="#">Games</a>

        <ul class="sub-menu">
          <li>
            <a href="blighters.html" class="transition-link">
              Blighters
            </a>
          </li>
        </ul>
      </li>

      <li>
        <a href="team.html" class="transition-link">
          Team
        </a>
      </li>

      <li>
        <a href="about.html" class="transition-link">
          About
        </a>
      </li>

    </ul>

  </div>

</nav>

<div class="fullscreen-bg">

  <video class="desktop-video" autoplay muted loop playsinline>
    <source src="studio_backer.webm" type="video/webm">
  </video>

  <video class="mobile-video" autoplay muted loop playsinline>
    <source src="mobile_backer_clean.webm" type="video/webm">
  </video>

</div>

<div class="content-overlay">

  <img
    src="studiologo.png"
    alt="Studio Troman Logo"
    class="company-logo"
  >

  <p class="blurb">
    Studio Troman is an independent game development studio dedicated to
    forging highly atmospheric worlds, striking visual narratives, and
    polished gameplay mechanics from the ground up.
  </p>

</div>

<script>
window.addEventListener('DOMContentLoadedument.querySelector('.hamburger');
  const dropdown = document.querySelector('.dropdown');

  hamburger?.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdown.classList.toggle('active');
  });

  document.querySelectorAll('.nested-dropdown > a').forEach(trigger => {

    trigger.addEventListener('click', (e) => {

      if (window.innerWidth <= 768) {
        e.preventDefault();
        trigger.parentElement.classList.toggle('open');
      }

    });

  });

  document.addEventListener('click', (e) => {

    if (
      dropdown &&
      !dropdown.contains(e.target) &&
      !hamburger.contains(e.target)
    ) {
      dropdown.classList.remove('active');
    }

  });

  document.querySelectorAll('.transition-link').forEach(link => {

    link.addEventListener('click', (e) => {

      const destination = link.getAttribute('href');

      if (
        !destination ||
        destination === '#' ||
        destination === window.location.pathname.split('/').pop()
      ) {
        return;
      }

      e.preventDefault();

      document.body.classList.add('exiting');

      setTimeout(() => {
        window.location.href = destination;
      }, 250);

    });

  });

});
</script>

</body>
</html>
