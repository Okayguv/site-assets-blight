<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Troman - Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }
        /* Shared Video Background Engine */
        .fullscreen-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 1;
            background-color: #000;
        }
        .desktop-video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: calc(100vw * (1000 / 2560));
            min-height: 100vh;
            min-width: calc(100vh * (2560 / 1000));
            transform: translate(-50%, -50%);
            object-fit: cover;
            display: block;
        }
        .mobile-video {
            display: none;
        }
        @media (max-width: 767px) {
            .desktop-video {
                display: none;
            }
            .mobile-video {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 100%;
                height: 100%;
                transform: translate(-50%, -50%);
                object-fit: cover;
                display: block;
            }
        }
        /* GLOBAL PAGE GLITCH TRANSITION CURTAIN */
        .page-transition-curtain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0d0d0d;
            z-index: 9999;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.4s ease-out;
        }
        .page-transition-curtain::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 10000;
            background-size: 100% 3px, 6px 100%;
        }
        body.loaded .page-transition-curtain {
            opacity: 0;
        }
        body.exiting .page-transition-curtain {
            opacity: 1;
            transition: opacity 0.25s ease-in;
        }
        /* Top Navigation Bar Container */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 0 40px;
            height: 70px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 100%);
            z-index: 10;
            opacity: 0;
        }
        body.loaded .top-navbar {
            opacity: 1;
            transition: opacity 0.8s ease;
        }
        
        /* Mobile Hamburger Trigger */
        .nav-toggle {
            display: none;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 20;
            padding: 10px;
        }

        /* Dropdown Menu Architecture */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-trigger {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            text-decoration: none;
        }
        .dropdown-trigger::after {
            content: '▼';
            font-size: 0.7rem;
            transition: transform 0.3s ease;
        }
        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background-color: rgba(15, 15, 15, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            min-width: 200px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            list-style: none;
        }
        .dropdown-menu a {
            color: rgba(255, 255, 255, 0.7);
            padding: 12px 20px;
            text-decoration: none;
            display: block;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            text-align: left;
        }
        .nested-dropdown {
            position: relative;
        }
        .nested-dropdown > a {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nested-dropdown > a::after {
            content: '▶';
            font-size: 0.6rem;
            transition: transform 0.2s ease;
        }
        .sub-menu {
            position: absolute;
            top: 0;
            left: 100%;
            background-color: rgba(20, 20, 20, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            min-width: 180px;
            opacity: 0;
            visibility: hidden;
            transform: translateX(10px);
            transition: all 0.25s ease;
            list-style: none;
        }
        
        /* Desktop Interaction Engine (Hover fallback) */
        @media (min-width: 769px) {
            .dropdown:hover .dropdown-menu {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
            }
            .dropdown:hover .dropdown-trigger {
                color: #ddd;
            }
            .dropdown:hover .dropdown-trigger::after {
                transform: rotate(180deg);
            }
            .nested-dropdown:hover .sub-menu {
                opacity: 1;
                visibility: visible;
                transform: translateX(0);
            }
            .dropdown-menu a:hover {
                background-color: rgba(255, 255, 255, 0.08);
                color: #fff;
            }
            .sub-menu a:hover {
                background-color: rgba(255, 255, 255, 0.12);
            }
        }

        /* JavaScript Activated Classes (Enables Mobile Clicks) */
        .dropdown.active .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .dropdown.active .dropdown-trigger::after {
            transform: rotate(180deg);
        }
        .nested-dropdown.active .sub-menu {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
            display: block !important;
        }
        .nested-dropdown.active > a::after {
            transform: rotate(90deg);
        }

        /* Main content layout overlay */
        .content-overlay {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 90px 20px 40px 20px;
            z-index: 2;
            overflow-y: auto;
        }
        /* INTRO TEXT GLITCH KEYFRAMES */
        @keyframes glitchIntro {
            0% { opacity: 0; transform: translateY(15px) skewX(4deg); filter: blur(2px); }
            60% { opacity: 0.8; transform: translateY(-2px) skewX(-2deg); filter: blur(0px); }
            80% { transform: skewX(8deg); }
            100% { opacity: 1; transform: translateY(0) skewX(0deg); }
        }
        /* Company Logo Setup */
        .company-logo {
            max-width: 450px;
            height: auto;
            display: block;
            filter: drop-shadow(0 4px 15px rgba(0,0,0,0.5));
            margin-bottom: 25px;
            opacity: 0;
        }
        body.loaded .company-logo {
            animation: glitchIntro 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.15s;
        }
        /* Description Text Style */
        p.blurb {
            font-size: 1.4rem;
            font-weight: 300;
            max-width: 600px;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
            line-height: 1.6;
            letter-spacing: 0.5px;
            opacity: 0;
        }
        body.loaded p.blurb {
            animation: glitchIntro 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.3s;
        }

        /* MOBILE OVERRIDES */
        @media (max-width: 768px) {
            .top-navbar {
                padding: 0 20px;
                height: 60px;
                justify-content: space-between;
                background: rgba(0, 0, 0, 0.85);
            }
            .nav-toggle {
                display: block;
            }
            .dropdown {
                position: static;
                width: 100%;
            }
            .dropdown-menu {
                position: fixed;
                top: 60px;
                left: 0;
                width: 100%;
                height: calc(100vh - 60px);
             <body>

             
    <!-- GLITCH CURTAIN BLOCK -->
    <div class="page-transition-curtain"></div>
    
    <!-- NAVIGATION BAR CONTAINER -->
    <nav class="top-navbar">
        <div class="dropdown">
            <button class="dropdown-trigger" id="mainNavMenu" aria-expanded="false">Menu</button>
            <ul class="dropdown-menu">
                <li><a href="index.html" class="transition-link">Home</a></li>
                <li class="nested-dropdown">
                    <a href="#" class="mobile-submenu-toggle">Games</a>
                    <ul class="sub-menu">
                        <li><a href="blighters.html" class="transition-link">Blighters</a></li>
                    </ul>
                </li>
                <li><a href="team.html" class="transition-link">Team</a></li>
                <li><a href="about.html" class="transition-link">About</a></li>
            </ul>
        </div>
    </nav>

    <!-- SHARED BACKGROUND ENGINE -->
    <div class="fullscreen-bg">
        <video class="desktop-video" autoplay loop muted playsinline>
            <source src="studio_backer.webm" type="video/webm">
        </video>
        <video class="mobile-video" autoplay loop muted playsinline>
            <source src="mobile_backer_clean.webm" type="video/webm">
        </video>
    </div>

    <!-- MAIN CORE CONTENT LAYOUT OVERLAY -->
    <div class="content-overlay">
        <img src="studiologo.png" alt="Studio Troman Logo" class="company-logo">
        <p class="blurb">Studio Troman is an independent game development studio dedicated to forging highly atmospheric worlds, striking visual narratives, and polished gameplay mechanics from the ground up.</p>
    </div>

    <!-- INTERACTIVE JAVASCRIPT ACTION ENGINE -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('loaded');
        });

        // Mobile Interactive Drawer Toggle Engine
        const mainDropdown = document.querySelector('.dropdown');
        const dropdownTrigger = document.querySelector('.dropdown-trigger');
        
        dropdownTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            const isActive = mainDropdown.classList.toggle('active');
            dropdownTrigger.setAttribute('aria-expanded', isActive);
        });

        // Nested Mobile Dropdown Mechanics
        const submenuToggle = document.querySelector('.mobile-submenu-toggle');
        const nestedLi = document.querySelector('.nested-dropdown');

        submenuToggle.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
                e.preventDefault(); // Stop immediate navigation strategy on parent node
                e.stopPropagation();
                nestedLi.classList.toggle('active');
            }
        });

        // Close dropdown when clicking outside of it
        document.addEventListener('click', (e) => {
            if (!mainDropdown.contains(e.target)) {
                mainDropdown.classList.remove('active');
                nestedLi.classList.remove('active');
                dropdownTrigger.setAttribute('aria-expanded', 'false');
            }
        });

        // Dynamic Outbound Navigation Glitch Interceptor
        document.querySelectorAll('.transition-link').forEach(link => {
            link.addEventListener('click', function(e) {
                const destination = this.getAttribute('href');
                if (destination && destination !== '#' && !destination.includes(window.location.pathname)) {
                    e.preventDefault();
                    document.body.classList.add('exiting');
                    setTimeout(() => {
                        window.location.href = destination;
                    }, 250);
                }
            });
        });
    </script>
</body>
</html>
