  <!-- GLITCH CURTAIN BLOCK -->
  <div class="page-transition-curtain"></div>

  <nav class="top-navbar">

      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>

    <div class="dropdown">
      <a href="index.html" class="transition-link dropdown-trigger">Menu</a>
      <ul class="dropdown-menu">
        <li class="mobile-only-home" style="display: none;"><a href="index.html" class="transition-link">Home</a></li>
        <li class="nested-dropdown">
          <a href="#" class="mobile-submenu-trigger">Games</a>

    <video class="mobile-video" autoplay loop muted playsinline>
