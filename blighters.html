<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blighters - Coming Soon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html { width: 100%; height: 100%; min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; background-color: #000; color: #fff; }
  
  /* Video Background Sizing Frame */
  .fullscreen-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; z-index: 1; background-color: #000; }
  .desktop-video { position: absolute; top: 50%; left: 50%; width: 100vw; height: calc(100vw * (1000 / 2560)); min-height: 100vh; min-width: calc(100vh * (2560 / 1000)); transform: translate(-50%, -50%); object-fit: cover; display: block; }
  .mobile-video { display: none; }

  @media (max-width: 767px) {
    .desktop-video { display: none; }
    .mobile-video { position: absolute; top: 50%; left: 50%; width: 100%; height: 100%; transform: translate(-50%, -50%); object-fit: cover; display: block; }
  }

  /* Top Navigation Bar Container */
  .top-navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 0 40px;
    height: 70px;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 100%);
    z-index: 10;
  }

  /* Level 1 Dropdown Architecture */
  .dropdown { position: relative; display: inline-block; }
  .dropdown-trigger { color: #fff; font-size: 1.1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; background: transparent; border: none; cursor: pointer; padding: 10px 15px; display: flex; align-items: center; gap: 8px; transition: color 0.3s ease; text-shadow: 1px 1px 4px rgba(0,0,0,0.8); }
  .dropdown-trigger::after { content: '▼'; font-size: 0.7rem; transition: transform 0.3s ease; }

  /* Level 2 Submenu Panel list */
  .dropdown-menu {
    position: absolute;
    top: 100%;
    left: 0;
    background-color: rgba(15, 15, 15, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 6px;
    min-width: 200px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    list-style: none;
  }
  .dropdown-menu a { color: rgba(255, 255, 255, 0.7); padding: 12px 20px; text-decoration: none; display: block; font-size: 0.95rem; letter-spacing: 0.5px; transition: all 0.2s ease; text-align: left; }

  /* Level 3 Cascading Flyout Menu Rules */
  .nested-dropdown { position: relative; }
  .nested-dropdown > a::after { content: ' ▶'; font-size: 0.6rem; float: right; margin-top: 4px; }
  .sub-menu {
    position: absolute;
    top: 0;
    left: 100%;
    background-color: rgba(20, 20, 20, 0.98);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 6px;
    min-width: 180px;
    opacity: 0;
    visibility: hidden;
    transform: translateX(10px);
    transition: all 0.25s ease;
    list-style: none;
  }

  /* Structural Hover Interaction Definitions */
  .dropdown:hover .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0); }
  .dropdown:hover .dropdown-trigger { color: #ddd; }
  .dropdown:hover .dropdown-trigger::after { transform: rotate(180deg); }
  .nested-dropdown:hover .sub-menu { opacity: 1; visibility: visible; transform: translateX(0); }
  .dropdown-menu a:hover { background-color: rgba(255, 255, 255, 0.08); color: #fff; }
  .sub-menu a:hover { background-color: rgba(255, 255, 255, 0.12); }

  /* Main content layout overlay positioned cleanly over the background */
  .content-overlay { position: relative; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 90px 20px 40px 20px; z-index: 2; overflow-y: auto; }
  
  .logo-container { margin-bottom: 20px; display: flex; justify-content: center; align-items: center; }
  .logo-video { width: 500px; height: auto; display: block; background: transparent; }

  .image-stack { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 25px; }
  .stacked-png { max-width: 320px; height: auto; display: block; }
  
  .wishlist-link { display: inline-block; cursor: pointer; transition: transform 0.2s ease, filter 0.2s ease; text-decoration: none; }
  .wishlist-link:hover { transform: scale(1.05); filter: drop-shadow(0 0 10px rgba(255,255,255,0.3)); }

  p.blurb { font-size: 1.4rem; margin-bottom: 20px; font-weight: 300; max-width: 600px; text-shadow: 1px 1px 5px rgba(0,0,0,0.8); line-height: 1.5; letter-spacing: 0.5px; }

  @media (max-width: 768px) {
    .top-navbar { padding: 0 20px; height: 60px; }
    p.blurb { font-size: 1.1rem; }
    .logo-video { width: 340px; }
    .stacked-png { max-width: 220px; }
    .nested-dropdown > a::after { content: ' ▼'; }
    .sub-menu { position: relative; left: 0; top: 0; width: 100%; opacity: 1; visibility: visible; transform: none; display: none; background: rgba(0,0,0,0.2); }
    .nested-dropdown:hover .sub-menu { display: block; }
  }
</style>
</head>
<body>

<nav class="top-navbar">
  <div class="dropdown">
    <button class="dropdown-trigger">Home</button>
    <ul class="dropdown-menu">
      <li class="nested-dropdown">
        <a href="index.html">Games</a>
        <ul class="sub-menu">
          <li><a href="blighters.html">Blighters</a></li>
        </ul>
      </li>
      <li><a href="team.html">Team</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </div>
</nav>

<div class="fullscreen-bg">
  <video class="desktop-video" autoplay loop muted playsinline>
    <source src="webbacker_notext.webm" type="video/webm">
  </video>
  <video class="mobile-video" autoplay loop muted playsinline>
    <source src="mobile_backer_clean.webm" type="video/webm">
  </video>
</div>

<div class="content-overlay">
  <div class="logo-container">
    <video class="logo-video" autoplay loop muted playsinline>
      <source src="blighterlogo.webm" type="video/webm">
    </video>
  </div>

  <div class="image-stack">
    <img src="WebpageLogo.png" alt="Blighters Logo Graphic" class="stacked-png">
    <!-- Replace the target store link inside the href parameter below -->
    <a href="https://steampowered.com" target="_blank" class="wishlist-link">
      <img src="wishlist.png" alt="Wishlist Now on Steam" class="stacked-png">
    </a>
  </div>

  <p class="blurb">We are building a brand new digital experience. Follow our journey as we get closer to launch and get ready for a completely fresh perspective.</p>
</div>

</body>
</html>
